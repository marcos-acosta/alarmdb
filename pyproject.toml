[project]
name = "alarmdb"
version = "1.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "lark>=1.3.1",
]

[project.scripts]
alarmdb = "alarmdb.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alarmdb"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-sugar>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
